<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics | Mr Lee's Corner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Times New Roman", serif;
    color: #fff3dc;
    background: #2a1a0a url("background.jpeg") center / cover no-repeat fixed;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  body::before { content: ""; position: fixed; inset: 0; background: rgba(15,8,2,.7); }
  .panel {
    position: relative; max-width: 36rem; width: 100%;
    padding: 2.5rem 2rem; border-radius: 16px;
    background: rgba(26,16,6,.7); border: 1px solid rgba(242,180,90,.35);
    backdrop-filter: blur(8px); text-align: center;
  }
  .tag { font-family: system-ui, sans-serif; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: #f2b45a; }
  h1 { margin-top: .6rem; font-size: clamp(2rem, 5vw, 2.8rem); font-weight: normal; }
  p { margin-top: 1rem; color: rgba(255,243,220,.8); }
  a.back { display: inline-block; margin-top: 1.8rem; color: #f2b45a; text-decoration: none; font-family: system-ui, sans-serif; border-bottom: 1px solid rgba(242,180,90,.5); }
  a.back:hover { border-color: #f2b45a; }
</style>
</head>
<body>
  <main class="panel">
    <span class="tag"></span>
    <p>The address has changed. Please visit here.</p>
    <a class="back" href="index.html">&larr; Back to Mr Lee's Corner</a>
  </main>
</body>
</html>
